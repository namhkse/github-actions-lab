name: Build Tomcat

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout tomcat-users.xml
      uses: actions/checkout@v2

    - name: List project files and java version
      run: |
          ls -ltr
          java -version

    - name: Checkout the tomcat repo
      uses: actions/checkout@v4.2.2
      with:
        repository: apache/tomcat
        ref: main
        path: ./tomcat

    - name: Setup Java
      uses: actions/setup-java@v4.7.1
      with:
        distribution: oracle
        java-version: 21
        java-package: jdk
        architecture: x64
    
    - name: List project files and java version
      run: |
          ls -ltr
          java -version
    
    - name: Copy tomcat-users.xml into Tomcat configuration directory
      run: cp -v tomcat-users.xml ./tomcat/conf/tomcat-users.xml
    
    - name: Compile Tomcat
      run: |
          cd ./tomcat
          ant