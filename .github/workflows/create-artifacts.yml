name: Create Artifact

on: [push, workflow_dispatch]

jobs:
  test:
    name: Test Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Setup Bun environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install
     
      - name: Test with differetn seeds
        run: |
          echo "test-1: no seed"
          bun run random-number-generator.js
          echo ""

          echo "test-2: string seed"
          bun run random-number-generator.js "test-seed"
          echo ""

          echo "test-3: numeric seed"
          bun run random-number-generator.js 1960
          echo ""
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: report.txt

  build:
    name: Build Executables
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
      
      - name: Setup bun enviroment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install  
      
      - name: Create the executables
        run: bun run build
      
      - name: List the executables created
        run: ls -la random-number-generator-*
      
      - name: Create an artifact
        uses: actions/upload-artifact@v4
        with:
          name: random-number-generator-executables
          path: ./random-number-generator-*
  
  test-linux:
    name: Test Linux Executable
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download the artifact
        uses: actions/download-artifact@v4
        with:
          name: random-number-generator-executables
      
      - name: Make the linux binary executable
        run: chmod +x random-number-generator-linux
      
      - name: Run executable
        run: |
          echo "test-1: test linux with no seed"
          ./random-number-generator-linux

          echo "test-2: test linux with string seed"
          ./random-number-generator-linux "test-seed"

          echo "test-3: test linux with numeric seed"
          ./random-number-generator-linux 1906
      
      - name: Upload the `report.txt` as an artifact named linux-test-report
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-report
          path: report.txt
