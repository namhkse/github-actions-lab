name: Multi-Job Workflow
on: [push]

jobs:
  ubuntu:
    runs-on: ubuntu-latest;
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5.5.0 
        with:
          go-version: "1.20"
      
      - name: Compile the Go
        run: go build -o main main.go
      
      - name: Run the compiled binary
        run: ./main
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5.5.0 
        with: 
          go-version: "1.20"
      
      - name: Compile the Go
        run: go build -o main.exe main.go
      
      - name: Run the compiled binary
        run: .\main.exe
  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5.5.0 
        with: 
          go-version: "1.20"
      
      - name: Compile the Go
        run: go build -o main main.go
      
      - name: Run the compiled binary
        run: ./main
  
  cross-compile:
    runs-on: ubuntu-latest
    needs: [ubuntu, windows, macos]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5.5.0 
        with: 
          go-version: "1.20"
      
      - name: Compile the Go
        run: go build -o main main.go
      
      - name: Cross-copile for all platforms
        run: |
          echo "Cross compiling for all platforms:"
          GOOS=linux GOARCH=amd64 go build -o main-linux main.go
          GOOS=windows GOARCH=amd64 go build -o main-windows.exe main.go
          GOOS=darwin GOARCH=amd64 go build -o main-macos-intel main.go